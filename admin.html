<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQ V4 COMPLETE</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script></head><body class="bg-black text-white p-4"><div class="max-w-3xl mx-auto"><h1 class="text-xl font-black">👑 HQ V4 - COMPLETE FIX</h1><p id="conn" class="text-xs text-zinc-500 mb-3">Paste keys below</p><input id="u" placeholder="https://hhrcnxwnyisckttfylgq.supabase.co" class="w-full bg-zinc-900 p-3 rounded-xl text-xs mb-2"><input id="k" placeholder="anon eyJ... (Legacy anon key)" class="w-full bg-zinc-900 p-3 rounded-xl text-xs mb-2"><input id="s" placeholder="service_role eyJ... (Legacy service key - LONGER)" class="w-full bg-zinc-900 border-2 border-yellow-500 p-3 rounded-xl text-xs mb-2"><button onclick="go()" class="w-full bg-white text-black p-3 rounded-xl font-bold mb-2">Connect + Load Users</button><button onclick="verifyAll()" class="w-full bg-yellow-400 text-black p-3 rounded-xl font-black mb-4">✅ VERIFY ALL 2 WAITING USERS</button><div id="list" class="bg-zinc-900 p-3 rounded-xl text-xs min-h-[150px]">Paste 3 keys then Connect</div><div id="wal" class="bg-zinc-900 p-3 rounded-xl text-xs mt-3"></div><p id="log" class="text-[9px] text-zinc-600 mt-2 break-all"></p></div><script>
let adm=null; const $=id=>document.getElementById(id);
const saved=JSON.parse(localStorage.getItem('hq4')||'{}'); if(saved.u) $('u').value=saved.u; if(saved.k) $('k').value=saved.k; if(saved.s) $('s').value=saved.s;
if(saved.u) go();
async function go(){
 const u=$('u').value.trim(); const k=$('k').value.trim(); const s=$('s').value.trim();
 if(!u||!k||!s) return alert('Paste all 3 boxes. Use LEGACY keys.');
 if(u.includes('fyigg')) return alert('URL TYPO! Use hhrcnxwnyisckttfylgq not fyigg');
 localStorage.setItem('hq4',JSON.stringify({u,k,s}));
 $('conn').textContent='Connecting to '+u+'...'; $('list').textContent='Loading...';
 try{
   adm=supabase.createClient(u,s);
   const {data, error} = await adm.auth.admin.listUsers({page:1, perPage:100});
   if(error) throw error;
   const users=data.users||[];
   $('conn').textContent='✅ Connected! Found '+users.length+' auth users';
   $('log').textContent='Success: '+users.length+' users';
   if(users.length===0){ $('list').innerHTML='API returned 0 users. Check: 1) service_role key must be LEGACY service_role eyJ... 2) URL must be exact hhrcnxwnyisckttfylgq'; return; }
   $('list').innerHTML=users.map(us=>`<div class="flex justify-between bg-black p-2 rounded mb-2 border ${!us.email_confirmed_at?'border-yellow-600':'border-zinc-800'}"><div><b class="${!us.email_confirmed_at?'text-yellow-300':''}">${us.email||'no-email'}</b><div class="text-[9px] text-zinc-500">${us.id}<br>${us.email_confirmed_at?'✅ Confirmed':'⏳ WAITING - tap Verify'}</div></div><div class="flex flex-col gap-1">${!us.email_confirmed_at?`<button onclick="verifyOne('${us.id}')" class="bg-yellow-400 text-black px-3 py-1 rounded text-[10px] font-black">Verify</button>`:''}<button onclick="delOne('${us.id}')" class="bg-red-900 px-2 py-1 rounded text-[9px]">Del</button></div></div>`).join('');
   const {data:wallets} = await adm.from('wallets').select('*').limit(50);
   const total=(wallets||[]).reduce((a,b)=>a+Number(b.balance||0),0);
   $('wal').innerHTML=`<b>Wallets: ${wallets? wallets.length:0} | ₦${total.toLocaleString()}</b><br>`+(wallets||[]).map(w=>w.user_id.slice(0,8)+' ₦'+w.balance).join('<br>')||'No wallets yet (users need to login once)';
 }catch(e){ $('list').innerHTML='❌ ERROR: '+e.message+'<br><br>USE LEGACY KEYS: Supabase Dashboard > API Keys > Top tabs click [Legacy anon, service_role] > copy anon + service_role. NOT sb_ keys.'; $('conn').textContent='❌ Failed'; $('log').textContent=e.message; }
}
async function verifyOne(id){ try{ const {error}=await adm.auth.admin.updateUserById(id,{email_confirm:true}); if(error) throw error; alert('✅ Verified!'); go(); }catch(e){alert('Failed: '+e.message);} }
async function verifyAll(){ try{ const {data}=await adm.auth.admin.listUsers(); let c=0; for(let u of (data.users||[])){ if(!u.email_confirmed_at){ await adm.auth.admin.updateUserById(u.id,{email_confirm:true}); c++; } } alert('✅ Verified '+c+' users!'); go(); }catch(e){alert(e.message);} }
async function delOne(id){ if(!confirm('Delete?')) return; await adm.auth.admin.deleteUser(id); go(); }
</script></body></html>
